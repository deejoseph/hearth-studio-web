      const curLine = ev ? ev.line : -1;
      $('sortCode').innerHTML = al.code.map((l, i) => `<div class="codeline${i === curLine ? ' cur' : ''}"><span class="ln">${i + 1}</span>${esc(l)}</div>`).join('');
      $('sortExplain').textContent = ev ? ev.text : '点"下一步"开始：橙色 = 正在比较，红色 = 正在交换，绿色 = 已永久就位。';
      $('sortPrev').disabled = step === 0;
      $('sortNext').disabled = step >= events.length;
      $('sortLabel').textContent = `第 ${step} / ${events.length} 步`;
      const c = ev ? ev.compares : 0, s = ev ? ev.swaps : 0, w = ev ? ev.writes : 0;
      $('sortStats').textContent = `比较 ${c} 次 · ${al.stat === 'writes' ? `挪动 ${w} 次` : `交换 ${s} 次`}${m.held !== undefined && m.held !== null ? ` · 手中 key=${m.held}` : ''}${m.range ? ` · 当前区间 [${m.range[0]}, ${m.range[1]}]` : ''}`;
    }

    ALGOS.forEach((al, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = al.title;
      b.addEventListener('click', () => { stop(); ai = i; regen(); render(); });
      $('sortAlgos').appendChild(b);
    });
    $('sortData').addEventListener('input', () => {
      const inp = $('sortData');
      const parts = inp.value.trim().split(/[\s,，、]+/).filter(Boolean);
      const ok = parts.length >= 2 && parts.length <= 12 && parts.every(t => /^\d{1,2}$/.test(t) && +t >= 1 && +t <= 99);
      inp.classList.toggle('invalid', !ok);
      if (!ok) return;
      stop(); data = parts.map(Number); regen(); render();
    });
    $('sortRandom').addEventListener('click', () => {
      stop();
      data = Array.from({ length: 8 }, () => 1 + Math.floor(Math.random() * 99));
      $('sortData').value = data.join(' ');
      $('sortData').classList.remove('invalid');
      regen(); render();
    });
    $('sortPrev').addEventListener('click', () => { stop(); if (step > 0) { step--; render(); } });
    $('sortNext').addEventListener('click', () => { stop(); if (step < events.length) { step++; render(); } });
    $('sortReset').addEventListener('click', () => { stop(); step = 0; render(); });
    $('sortAuto').addEventListener('click', () => {
      if (timer) { stop(); return; }
      if (step >= events.length) { step = 0; render(); }
      autoBtn.textContent = '停止';
      timer = setInterval(() => {
        if (!document.contains(nextBtn)) { stop(); return; }
        if (step >= events.length) { stop(); render(); return; }
        step++; render();
      }, 700);
    });

    regen();
    render();
  }

  return { id: 'sort', name: '排序动画', mount };
}

function makeStructTool() {
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const TYPES = {
    'char': { size: 1, align: 1 },
    'short': { size: 2, align: 2 },
    'int': { size: 4, align: 4 },
    'float': { size: 4, align: 4 },
    'double': { size: 8, align: 8 },
    'long long': { size: 8, align: 8 },
  };
  const PALETTE = ['#2563eb', '#7c3aed', '#059669', '#d97706', '#dc2626', '#0891b2', '#be185d', '#65a30d'];
  const PRESETS = [
    { title: '① 经典浪费 char-int-char', members: [{ name: 'a', type: 'char' }, { name: 'b', type: 'int' }, { name: 'c', type: 'char' }] },
    { title: '② 重排后省 4 字节', members: [{ name: 'b', type: 'int' }, { name: 'a', type: 'char' }, { name: 'c', type: 'char' }] },
    { title: '③ 含 double', members: [{ name: 'a', type: 'char' }, { name: 'b', type: 'double' }, { name: 'c', type: 'int' }] },
    { title: '④ short-char-int-short', members: [{ name: 'a', type: 'short' }, { name: 'b', type: 'char' }, { name: 'c', type: 'int' }, { name: 'd', type: 'short' }] },
    { title: '⑤ double-char', members: [{ name: 'x', type: 'double' }, { name: 'y', type: 'char' }] },
  ];

  function layout(members) {
    const align = Math.max(...members.map(m => TYPES[m.type].align), 1);
    let offset = 0, sum = 0;
    const placed = members.map((m, idx) => {
      const t = TYPES[m.type];
      const pad = (t.align - (offset % t.align)) % t.align;
      const start = offset + pad;
      offset = start + t.size;
      sum += t.size;
      return { name: m.name || ('m' + (idx + 1)), type: m.type, size: t.size, align: t.align, offset: start, padBefore: pad, idx };
    });
    const trailing = (align - (offset % align)) % align;
    return { placed, align, trailing, total: offset + trailing, sum };
  }

  function mount(host) {
    host.innerHTML = `
      <div class="panel">
        <div class="presets" id="stPresets"></div>
        <div class="rule">逐个放置成员，看填充字节（斜纹）从哪来。规则：成员偏移必须是自身对齐的倍数；sizeof 必须是结构体对齐（= 成员最大对齐）的倍数。</div>
        <div id="stRows" style="margin-top:10px"></div>
        <div class="presets" style="margin-top:4px">
          <button type="button" id="stAdd">＋ 加成员</button>
          <button type="button" id="stOpt">按对齐从大到小重排（最省）</button>
        </div>
        <div class="rule" id="stOptMsg"></div>
      </div>
      <div class="panel">
        <div class="operand-head"><span class="name">内存布局（每格 1 字节，数字 = 偏移）</span><span class="expr" id="stSizeof"></span></div>
        <div class="bytes" id="stBytes"></div>
        <div class="legend" id="stLegend"></div>
        <div class="rule" id="stWaste" style="margin-top:8px"></div>
        <div class="ptr-explain" id="stExplain" style="margin-top:8px"></div>
        <div class="ptr-controls">
          <button type="button" id="stPrev">上一步</button>
          <button type="button" id="stNext" class="next">下一步</button>
          <button type="button" id="stReset">重置</button>
          <span id="stLabel" style="font-size:13px;color:var(--dim)"></span>
        </div>
      </div>
      <div class="panel">
        <div class="ptr-layout">
          <div class="ptr-code" id="stCode"></div>
          <div class="ptr-side">
            <table style="width:100%;border-collapse:collapse;font-size:13px" id="stTable"></table>
          </div>
        </div>
      </div>
      <div class="panel">
        <h2>要点</h2>
        <div class="ptr-explain" style="min-height:0">对齐不是浪费癖：CPU 按对齐边界访问内存最快，未对齐访问在某些架构上会直接崩溃。三条规则——① 首个成员偏移 0；② 每个成员偏移 = 向上取整到自身对齐的倍数；③ sizeof = 向上取整到结构体对齐（成员最大对齐）的倍数。把对齐大的成员放前面，通常能减少填充。</div>
        <div class="langnote">这里的大小/对齐以常见 64 位平台为例，实际随平台与编译器变化，用 sizeof 和 offsetof（&lt;stddef.h&gt;）实测为准。#pragma pack(1) 可取消填充（省空间但访问慢、可能崩溃，常用于协议/文件格式）。Python 的 struct 模块用格式串显式控制对齐（如 '&lt;' 小端无对齐），Java 对象布局由 JVM 决定、不直接暴露。</div>
      </div>`;

    const $ = id => host.querySelector('#' + id);
    let members = PRESETS[0].members.map(m => ({ ...m }));
    let step = 0, L = null, steps = [];

    function buildSteps() {
      L = layout(members);
      steps = [{ kind: 'intro', text: `这个结构体有 ${L.placed.length} 个成员，sizeof = ${L.total} 字节。结构体对齐 = 成员最大对齐 = ${L.align}。点"下一步"看每个成员怎么放、填充怎么来。` }];
      L.placed.forEach(p => {
        const padText = p.padBefore > 0
          ? `轮到它时偏移是 ${p.offset - p.padBefore}，不是 ${p.align} 的倍数，先填 ${p.padBefore} 字节补到 ${p.offset}。`
          : `轮到它时偏移是 ${p.offset}，已是 ${p.align} 的倍数，不用填充。`;
        steps.push({ kind: 'member', p, text: `${p.name}（${p.type}，大小 ${p.size}，对齐 ${p.align}）：${padText}放在偏移 ${p.offset}，占 ${p.offset}~${p.offset + p.size - 1}。` });
      });
      steps.push({ kind: 'end', text: `最后一个成员到偏移 ${L.total - L.trailing - 1} 结束（共 ${L.total - L.trailing} 字节）。sizeof 必须是结构体对齐 ${L.align} 的倍数，向上取整到 ${L.total}${L.trailing ? `，尾部再填 ${L.trailing} 字节` : '，恰好整除不用填'}。所以 sizeof = ${L.total}，不是成员大小之和 ${L.sum}。` });
    }

    function byteMap() {
      const bytes = new Array(L.total).fill(null);
      L.placed.forEach(p => { for (let i = p.offset; i < p.offset + p.size; i++) bytes[i] = p; });
      return bytes;
    }

    function renderLayout() {
      buildSteps();
      if (step >= steps.length) step = 0;
      const st = steps[step];
      const bytes = byteMap();
      let hl = null;
      if (st.kind === 'member') hl = [st.p.offset - st.p.padBefore, st.p.offset + st.p.size - 1];
      if (st.kind === 'end') hl = L.trailing ? [L.total - L.trailing, L.total - 1] : null;
      $('stBytes').innerHTML = bytes.map((b, i) => {
        const inHl = hl && i >= hl[0] && i <= hl[1];
        const cls = 'byte' + (b ? '' : ' pad') + (hl ? (inHl ? ' hl' : ' dim') : '');
        const style = b ? `background:${PALETTE[b.idx % PALETTE.length]}` : '';
        return `<div class="${cls}" style="${style}">${b ? esc(b.name.slice(0, 2)) : '·'}<span class="boff">${i}</span></div>`;
      }).join('');
      $('stLegend').innerHTML = L.placed.map(p => `<span class="sw" style="background:${PALETTE[p.idx % PALETTE.length]}"></span>${esc(p.name)}（${p.type}）`).join('') + '<span class="sw" style="background:repeating-linear-gradient(45deg,#e2e8f0,#e2e8f0 4px,#cbd5e1 4px,#cbd5e1 8px)"></span>填充';
      $('stSizeof').textContent = `sizeof = ${L.total}`;
      const waste = L.total - L.sum;
      $('stWaste').textContent = `成员实际数据 ${L.sum} 字节 + 填充 ${waste} 字节 = ${L.total} 字节${waste ? `（浪费了 ${Math.round(waste / L.total * 100)}%）` : '（没有浪费）'}`;
      $('stExplain').textContent = st.text;
      $('stPrev').disabled = step === 0;
      $('stNext').disabled = step >= steps.length - 1;
      $('stLabel').textContent = `第 ${step} / ${steps.length - 1} 步`;

      const codeLines = ['struct Example {', ...L.placed.map(p => `    ${p.type} ${p.name};${' '.repeat(Math.max(1, 12 - p.type.length - p.name.length))}// 偏移 ${p.offset}`), '};', `// sizeof(struct Example) = ${L.total}`];
      const curLine = st.kind === 'member' ? st.p.idx + 1 : st.kind === 'end' ? codeLines.length - 1 : -1;
      $('stCode').innerHTML = codeLines.map((l, i) => `<div class="codeline${i === curLine ? ' cur' : ''}"><span class="ln">${i + 1}</span>${esc(l)}</div>`).join('');

      let rows = '<tr style="text-align:left;color:var(--dim)"><th style="padding:4px 8px">成员</th><th>类型</th><th>大小</th><th>对齐</th><th>偏移</th></tr>';
      L.placed.forEach(p => {
        if (p.padBefore) rows += `<tr style="color:#94a3b8"><td style="padding:4px 8px">填充</td><td>—</td><td>${p.padBefore}</td><td>—</td><td>${p.offset - p.padBefore}~${p.offset - 1}</td></tr>`;
        rows += `<tr${st.kind === 'member' && st.p === p ? ' style="background:#fef3c7;font-weight:600"' : ''}><td style="padding:4px 8px">${esc(p.name)}</td><td>${p.type}</td><td>${p.size}</td><td>${p.align}</td><td>${p.offset}</td></tr>`;
      });
      if (L.trailing) rows += `<tr style="color:#94a3b8"><td style="padding:4px 8px">尾部填充</td><td>—</td><td>${L.trailing}</td><td>—</td><td>${L.total - L.trailing}~${L.total - 1}</td></tr>`;
      $('stTable').innerHTML = rows;
    }

    function renderRows() {
      const box = $('stRows');
      box.innerHTML = '';
      members.forEach((m, i) => {
        const row = document.createElement('div');
        row.className = 'mrow';
        const sw = document.createElement('span');
        sw.className = 'swatch';
        sw.style.background = PALETTE[i % PALETTE.length];
        const name = document.createElement('input');
        name.type = 'text'; name.value = m.name; name.maxLength = 12;
        name.addEventListener('input', () => { members[i].name = name.value.trim(); renderLayout(); });
        const sel = document.createElement('select');
        Object.keys(TYPES).forEach(t => {
          const o = document.createElement('option');
          o.value = t; o.textContent = `${t}（${TYPES[t].size} 字节）`;
          if (t === m.type) o.selected = true;
          sel.appendChild(o);
        });
        sel.addEventListener('change', () => { members[i].type = sel.value; step = 0; renderLayout(); });
        const up = document.createElement('button'); up.type = 'button'; up.textContent = '↑'; up.disabled = i === 0;
        up.addEventListener('click', () => { [members[i - 1], members[i]] = [members[i], members[i - 1]]; step = 0; renderRows(); renderLayout(); });
        const down = document.createElement('button'); down.type = 'button'; down.textContent = '↓'; down.disabled = i === members.length - 1;
        down.addEventListener('click', () => { [members[i + 1], members[i]] = [members[i], members[i + 1]]; step = 0; renderRows(); renderLayout(); });
        const del = document.createElement('button'); del.type = 'button'; del.textContent = '删'; del.disabled = members.length <= 1;
        del.addEventListener('click', () => { members.splice(i, 1); step = 0; renderRows(); renderLayout(); });
        row.append(sw, name, sel, up, down, del);
        box.appendChild(row);
      });
    }

    PRESETS.forEach(pr => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = pr.title;
      b.addEventListener('click', () => { members = pr.members.map(m => ({ ...m })); step = 0; $('stOptMsg').textContent = ''; renderRows(); renderLayout(); });
      $('stPresets').appendChild(b);
    });
    $('stAdd').addEventListener('click', () => {
      if (members.length >= 8) { $('stOptMsg').textContent = '最多 8 个成员（演示够用）。'; return; }
      members.push({ name: 'm' + (members.length + 1), type: 'int' });
      step = 0; renderRows(); renderLayout();
    });
    $('stOpt').addEventListener('click', () => {
      const before = layout(members).total;
      members = members.map((m, i) => ({ m, i })).sort((x, y) => TYPES[y.m.type].align - TYPES[x.m.type].align || x.i - y.i).map(x => x.m);
      const after = layout(members).total;
      step = 0; renderRows(); renderLayout();
      $('stOptMsg').textContent = after < before ? `重排后 sizeof ${before} → ${after}，省了 ${before - after} 字节！` : `重排后 sizeof 仍是 ${after}，这个顺序已经很省了。`;
    });
    $('stPrev').addEventListener('click', () => { if (step > 0) { step--; renderLayout(); } });
    $('stNext').addEventListener('click', () => { if (step < steps.length - 1) { step++; renderLayout(); } });
    $('stReset').addEventListener('click', () => { step = 0; renderLayout(); });

    renderRows();
    renderLayout();
  }

  return { id: 'struct', name: '结构体对齐', mount };
}

function makeMemoryTool() {
  const ADDR = n => '0x' + n.toString(16).toUpperCase().padStart(4, '0');
  const ptr = (id, label, addr, value, target) => ({ id, label, addr, value, target: target || null, garbage: false, isNull: false });
  const block = (id, addr, count, values) => ({ id, addr, count, elemSize: 4, values: values.slice(), status: 'live' });
  const P = (m, id) => m.stack.find(c => c.id === id);
  const B = (m, id) => m.heap.find(b => b.id === id);

  const SCENARIOS = [
    {
      title: '① malloc / free 基础',
      intro: '堆内存由你手动管理：malloc 申请、free 归还。点"下一步"逐行执行，看栈上的指针和堆上的块如何变化。',
      code: ['int *p = malloc(4 * sizeof(int));', 'if (p == NULL) return 1;', 'p[0] = 10; p[3] = 40;', 'printf("%d\\n", p[0]);', 'free(p);', 'p = NULL;'],
      init: () => ({ stack: [], heap: [], output: [] }),
      steps: [
        { line: 0, changed: ['p', 'H1'], text: 'malloc 在堆上申请 4×4=16 字节（块 H1，示意地址 0x2000），返回首地址存进栈上的指针 p。堆块内容是未初始化的垃圾值（???）。注意：p 自己在栈上，它指向的数据在堆上。',
          apply: m => { m.heap.push(block('H1', 0x2000, 4, [null, null, null, null])); m.stack.push(ptr('p', 'p', 0x1000, 0x2000, 'H1')); } },
        { line: 1, changed: ['p'], text: 'malloc 可能因内存不足失败、返回 NULL。用之前必须检查，否则对 NULL 解引用会崩溃。这里 p 非空，继续。', apply: () => {} },
        { line: 2, changed: ['H1'], text: 'p[0]=10、p[3]=40：通过指针写堆内存，用法和数组完全一样（p[i] 就是 *(p+i)）。',
          apply: m => { const b = B(m, 'H1'); b.values[0] = 10; b.values[3] = 40; } },
        { line: 3, changed: ['H1'], text: '读出 p[0] = 10。', apply: m => { m.output.push('10'); } },
        { line: 4, changed: ['H1', 'p'], text: 'free(p) 把 H1 还给堆管理器，块标记为"已释放"。但 p 里存的地址 0x2000 没变——此刻 p 是悬空指针（dangling pointer），指向的地盘已不属于你。',
          apply: m => { B(m, 'H1').status = 'freed'; } },
        { line: 5, changed: ['p'], text: 'p = NULL：良好习惯。free 后立刻置空，之后万一误写 *p 会对 NULL 解引用、立刻崩溃，而不是静默写坏别人的内存。free(NULL) 本身是标准保证的安全空操作。',
          apply: m => { const p = P(m, 'p'); p.value = null; p.target = null; p.isNull = true; } },
      ],
    },
    {
      title: '② calloc vs malloc',
      intro: '两者都申请堆内存，区别在于要不要清零。',
      code: ['int *a = malloc(3 * sizeof(int));', 'int *b = calloc(3, sizeof(int));', 'printf("%d %d\\n", a[0], b[0]);', 'free(a); free(b);'],
      init: () => ({ stack: [], heap: [], output: [] }),
      steps: [
        { line: 0, changed: ['a', 'H1'], text: 'malloc 申请 12 字节（H1），内容是垃圾值（???）——malloc 只负责给地盘，不负责打扫。',
          apply: m => { m.heap.push(block('H1', 0x2000, 3, [null, null, null])); m.stack.push(ptr('a', 'a', 0x1000, 0x2000, 'H1')); } },
        { line: 1, changed: ['b', 'H2'], text: 'calloc(3, sizeof(int)) 同样申请 12 字节（H2），但会把每一位都清零——三个元素保证是 0。参数是"个数 × 单个大小"，还会检查乘法溢出。',
          apply: m => { m.heap.push(block('H2', 0x2010, 3, [0, 0, 0])); m.stack.push(ptr('b', 'b', 0x1004, 0x2010, 'H2')); } },
        { line: 2, changed: ['H1', 'H2'], text: '读 a[0]：未初始化的 malloc 内存，值随机、读它本身是未定义行为；读 b[0]：calloc 保证是 0。需要"干净"内存时用 calloc（或 malloc 后 memset 清零）。',
          apply: m => { m.output.push('(垃圾值) 0'); } },
        { line: 3, changed: ['H1', 'H2', 'a', 'b'], text: '两块都 free。注意 a、b 释放后仍是悬空指针，真实代码应再写 a = NULL; b = NULL;。',
          apply: m => { B(m, 'H1').status = 'freed'; B(m, 'H2').status = 'freed'; } },
      ],
    },
    {
      title: '③ realloc 扩容',
      intro: 'realloc 可能原地扩展，也可能"搬家"。关键是永远用临时指针接返回值。',
      code: ['int *p = malloc(2 * sizeof(int));', 'p[0] = 1; p[1] = 2;', 'int *q = realloc(p, 4 * sizeof(int));', 'if (q == NULL) { free(p); return 1; }', 'p = q;', 'p[3] = 4;', 'free(p);'],
      init: () => ({ stack: [], heap: [], output: [] }),
      steps: [
        { line: 0, changed: ['p', 'H1'], text: '先 malloc 8 字节（H1，2 个 int）。',
          apply: m => { m.heap.push(block('H1', 0x2000, 2, [null, null])); m.stack.push(ptr('p', 'p', 0x1000, 0x2000, 'H1')); } },
        { line: 1, changed: ['H1'], text: '写入 1、2。', apply: m => { const b = B(m, 'H1'); b.values[0] = 1; b.values[1] = 2; } },
        { line: 2, changed: ['q', 'H1', 'H2'], text: 'realloc 想扩到 16 字节。这里演示"搬家"：H1 旁边没有连续空位，于是另开新块 H2（0x2010），把旧数据 1、2 复制过去，新增的 2 个 int 是垃圾值，再释放旧块 H1。返回值是新地址，用 q 接收。此刻 p 仍指向已释放的 H1——悬空！',
          apply: m => { B(m, 'H1').status = 'freed'; m.heap.push(block('H2', 0x2010, 4, [1, 2, null, null])); m.stack.push(ptr('q', 'q', 0x1004, 0x2010, 'H2')); } },
        { line: 3, changed: ['q'], text: '检查 q 是否为 NULL。关键：不能写 p = realloc(p, ...)——万一 realloc 失败返回 NULL，p 被覆盖成 NULL，原来 H1 的地址就丢了，造成泄漏。所以先用临时指针 q 接，确认成功再赋值；失败时还能 free(p) 兜底。', apply: () => {} },
        { line: 4, changed: ['p'], text: '确认 q 非空，p = q：p 更新为新地址 0x2010，重新指向有效的 H2。',
          apply: m => { const p = P(m, 'p'); p.value = 0x2010; p.target = 'H2'; } },
        { line: 5, changed: ['H2'], text: 'p[3] = 4：现在可以安全使用扩容后的 4 个元素。',
          apply: m => { B(m, 'H2').values[3] = 4; } },
        { line: 6, changed: ['H2', 'p'], text: 'free(p) 释放最终的有效块 H2。（演示结束，实际代码记得再写 p = NULL。）',
          apply: m => { B(m, 'H2').status = 'freed'; } },
      ],
    },
    {
      title: '④ 内存泄漏（危险示范）',
      intro: 'malloc 了却不 free，指针又先一步消失——堆块就再也找不回来了。',
      code: ['void leak(void) {', '    int *p = malloc(100 * sizeof(int));', '    p[0] = 42;', '    return;   /* 没有 free！ */', '}'],
      init: () => ({ stack: [], heap: [], output: [] }),
      steps: [
        { line: 1, changed: ['p', 'H1'], text: '在函数里 malloc 400 字节（H1，100 个 int，图上只画前 3 个示意）。p 在栈上，指向堆块 H1。',
          apply: m => { const b = block('H1', 0x2000, 100, [null, null, null]); m.heap.push(b); m.stack.push(ptr('p', 'p', 0x1000, 0x2000, 'H1')); } },
        { line: 2, changed: ['H1'], text: 'p[0] = 42，用了一下这块内存。',
          apply: m => { B(m, 'H1').values[0] = 42; } },
        { line: 3, changed: ['p', 'H1'], warn: '内存泄漏：H1（400 字节）仍被堆管理器记为"已分配"，但唯一的指针 p 随函数返回被销毁，再也没人能找到它、free 它。',
          text: '函数返回：栈上的 p 被自动销毁，但堆上的 H1 不会自动回收！没有任何指针再指向 H1，它永远无法被 free——这就是内存泄漏。每调用一次 leak() 就漏 400 字节，程序跑久了内存耗尽。正确做法：return 前 free(p)。',
          apply: m => { m.stack = m.stack.filter(c => c.id !== 'p'); B(m, 'H1').status = 'leaked'; } },
      ],
    },
    {
      title: '⑤ 悬空指针 / use-after-free',
      intro: 'free 之后指针还指着旧地址，继续读写就是未定义行为。',
      code: ['int *p = malloc(sizeof(int));', '*p = 7;', 'free(p);', '*p = 99;      /* 危险！ */', 'printf("%d\\n", *p);'],
      init: () => ({ stack: [], heap: [], output: [] }),
      steps: [
        { line: 0, changed: ['p', 'H1'], text: 'malloc 4 字节（H1），p 指向它。',
          apply: m => { m.heap.push(block('H1', 0x2000, 1, [null])); m.stack.push(ptr('p', 'p', 0x1000, 0x2000, 'H1')); } },
        { line: 1, changed: ['H1'], text: '*p = 7，正常写入。', apply: m => { B(m, 'H1').values[0] = 7; } },
        { line: 2, changed: ['H1', 'p'], text: 'free(p)：H1 已释放。p 没置 NULL，仍指向 0x2000——悬空指针。',
          apply: m => { B(m, 'H1').status = 'freed'; } },
        { line: 3, changed: ['H1'], warn: '未定义行为（use-after-free）：写入已释放的内存。这块地可能已被重新分配给别的 malloc，你在篡改别人的数据；也可能触发堆损坏、延迟崩溃。',
          text: '*p = 99：顺着悬空指针写进已释放的 H1。值"看起来"写进去了，但这块内存已不属于你——这是未定义行为，错误往往在很久以后才暴露，极难排查。',
          apply: m => { B(m, 'H1').values[0] = 99; } },
        { line: 4, changed: ['H1'], warn: '未定义行为：读取已释放的内存，结果不可预测。',
          text: '读 *p：同样是对已释放内存的访问，结果不可预测。正确做法：free 后 p = NULL，需要新内存就重新 malloc。',
          apply: m => { m.output.push('(不可预测)'); } },
      ],
    },
    {
      title: '⑥ 重复释放 double free',
      intro: '同一块内存 free 两次，会破坏堆管理器的内部结构。',
      code: ['int *p = malloc(sizeof(int));', 'free(p);', 'free(p);      /* 危险！ */'],
      init: () => ({ stack: [], heap: [], output: [] }),
      steps: [
        { line: 0, changed: ['p', 'H1'], text: 'malloc 4 字节（H1），p 指向它。',
          apply: m => { m.heap.push(block('H1', 0x2000, 1, [null])); m.stack.push(ptr('p', 'p', 0x1000, 0x2000, 'H1')); } },
        { line: 1, changed: ['H1', 'p'], text: '第一次 free(p)：H1 正常释放，归还给堆管理器。p 仍是悬空指针。',
          apply: m => { B(m, 'H1').status = 'freed'; } },
        { line: 2, changed: ['H1'], warn: '未定义行为（double free）：同一块内存释放两次，堆管理器的空闲链表被破坏。glibc 通常立刻 abort 并报 "double free or corruption"，这类漏洞也可能被攻击者利用。',
          text: '第二次 free(p)：H1 已经在空闲链表里了，再释放一次会把堆管理器的内部结构搞坏。防范：free 后立刻 p = NULL——free(NULL) 是标准保证的安全空操作，第二次 free 就什么都不会发生。', apply: () => {} },
      ],
    },
  ];

  function mount(host) {
    host.innerHTML = `
      <div class="panel">
        <div class="presets" id="mmScenarios"></div>
        <div class="rule" id="mmIntro"></div>
      </div>
      <div class="panel">
        <div class="ptr-layout">
          <div class="ptr-code" id="mmCode"></div>
          <div class="ptr-side">
            <div class="ptr-explain" id="mmExplain"></div>
            <div id="mmWarn"></div>
            <div class="ptr-controls">
              <button type="button" id="mmPrev">上一步</button>
              <button type="button" id="mmNext" class="next">下一步</button>
              <button type="button" id="mmReset">重置</button>
              <span id="mmStep" style="font-size:13px;color:var(--dim)"></span>
            </div>
            <div class="ptr-console" id="mmConsole"></div>
          </div>
        </div>
      </div>
      <div class="panel">
        <h2>内存布局（地址为示意值，真实地址每次运行都不同）</h2>
        <div class="memzones" id="mmZones">
          <svg id="mmSvg"></svg>
          <div class="zonelabel">栈 stack —— 指针变量住这里，函数返回自动销毁</div>
          <div class="zonerow" id="mmStack"></div>
          <div class="zonegap"></div>
          <div class="zonelabel">堆 heap —— malloc / calloc / realloc 的块住这里，必须手动 free</div>
          <div class="zonerow" id="mmHeap"></div>
        </div>
        <div class="heapstats" id="mmStats"></div>
        <div class="legend"><span class="sw" style="background:var(--purple)"></span>紫框 = 指针变量<span class="sw" style="background:#f0fdf4;border:1px solid var(--green)"></span>绿块 = 使用中<span class="sw" style="background:#f8fafc;border:1px dashed #94a3b8"></span>灰虚线 = 已释放<span class="sw" style="background:#fef2f2;border:1px dashed var(--red)"></span>红虚线 = 泄漏<span class="sw" style="background:#fff;border:1px solid #f59e0b"></span>橙框 = 本步变化</div>
      </div>
      <div class="panel">
        <h2>要点</h2>
        <div class="langnote">① 谁 malloc 谁 free，一一对应；② malloc/calloc/realloc 返回值先判 NULL 再用；③ realloc 用临时指针接，成功后再赋回原指针；④ free 后立刻置 NULL，杜绝悬空指针和 double free（free(NULL) 安全）；⑤ 栈变量函数返回自动销毁，堆块必须手动释放，否则泄漏。工具推荐：Valgrind、AddressSanitizer（-fsanitize=address）能自动揪出泄漏和 use-after-free。</div>
        <h2 style="margin-top:12px">和其他语言对比</h2>
        <div class="langnote">Python / Java 有垃圾回收（GC）：对象没人引用时自动回收，程序员不写 free，也因此很少遇到泄漏和悬空指针（但循环引用仍可能让 GC 回收不掉）。C 把内存管理权完全交给你——灵活、零运行时开销，代价是必须自己保证每块内存恰好释放一次。Rust 则用所有权机制在编译期杜绝这类错误。</div>
      </div>`;

    const $ = id => host.querySelector('#' + id);
    let si = 0, step = 0;

    SCENARIOS.forEach((sc, i) => {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.textContent = sc.title;
      btn.addEventListener('click', () => { si = i; step = 0; render(); });
      $('mmScenarios').appendChild(btn);
    });

    function currentState() {
      const sc = SCENARIOS[si];
      const m = sc.init();
      for (let k = 0; k < step; k++) sc.steps[k].apply(m);
      return m;
    }

    function drawArrows() {
      const svg = $('mmSvg'), zones = $('mmZones');
      svg.innerHTML = '<defs><marker id="mmah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/></marker></defs>';
      const gr = zones.getBoundingClientRect();
      currentState().stack.filter(c => c.target).forEach(c => {
        const from = zones.querySelector('[data-cell="' + c.id + '"]');
        const to = zones.querySelector('[data-cell="' + c.target + '"]');
        if (!from || !to) return;
        const fr = from.getBoundingClientRect(), tr = to.getBoundingClientRect();
        const x1 = fr.left + fr.width / 2 - gr.left, y1 = fr.bottom - gr.top;
        const x2 = tr.left + tr.width / 2 - gr.left, y2 = tr.top - gr.top;
        const lift = Math.max(20, (y2 - y1) / 2);
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${x1} ${y1} C ${x1} ${y1 + lift}, ${x2} ${y2 - lift}, ${x2} ${y2 - 2}`);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', '#7c3aed');
        path.setAttribute('stroke-width', '1.5');
        path.setAttribute('marker-end', 'url(#mmah)');
        svg.appendChild(path);
      });
    }

    function render() {
      const sc = SCENARIOS[si];
      const m = currentState();
      const last = step > 0 ? sc.steps[step - 1] : null;
      const changed = last ? last.changed : [];

      $('mmIntro').textContent = sc.intro;
      $('mmScenarios').querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i === si));

      const codeEl = $('mmCode');
      codeEl.innerHTML = '';
      sc.code.forEach((line, i) => {
        const div = document.createElement('div');
        div.className = 'codeline' + (last && last.line === i ? ' cur' : '');
        const ln = document.createElement('span');
        ln.className = 'ln'; ln.textContent = i + 1;
        div.appendChild(ln);
        div.appendChild(document.createTextNode(line));
        codeEl.appendChild(div);
      });

      $('mmExplain').textContent = last ? last.text : sc.intro;
      $('mmWarn').innerHTML = last && last.warn ? `<div class="warn ub">⚠ ${last.warn}</div>` : '';
      $('mmPrev').disabled = step === 0;
      $('mmNext').disabled = step === sc.steps.length;
      $('mmStep').textContent = `第 ${step} / ${sc.steps.length} 步`;
      $('mmConsole').textContent = m.output.length ? '输出: ' + m.output.join('\n') : '（还没有输出）';

      const stackEl = $('mmStack');
      stackEl.innerHTML = '';
      m.stack.forEach(c => {
        const el = document.createElement('div');
        el.className = 'cell ptr' + (c.garbage ? ' garbage' : '') + (c.isNull ? ' nullval' : '') + (changed.includes(c.id) ? ' changed' : '');
        el.dataset.cell = c.id;
        const name = document.createElement('div');
        name.className = 'cname'; name.textContent = c.label + ' (int *)';
        const val = document.createElement('div');
        val.className = 'cval';
        val.textContent = c.isNull ? 'NULL' : c.value === null ? '???' : ADDR(c.value);
        const addr = document.createElement('div');
        addr.className = 'caddr'; addr.textContent = ADDR(c.addr);
        el.append(name, val, addr);
        stackEl.appendChild(el);
      });
      if (!m.stack.length) stackEl.innerHTML = '<span style="font-size:13px;color:#94a3b8">（栈上已无指针变量）</span>';

      const heapEl = $('mmHeap');
      heapEl.innerHTML = '';
      m.heap.forEach(b => {
        const wrap = document.createElement('div');
        wrap.className = 'heapblock' + (b.status === 'freed' ? ' freed' : '') + (b.status === 'leaked' ? ' leaked' : '') + (changed.includes(b.id) ? ' changed' : '');
        wrap.dataset.cell = b.id;
        const head = document.createElement('div');
        head.className = 'blockhead';
        const statusText = b.status === 'live' ? '使用中' : b.status === 'freed' ? '已释放' : '泄漏！';
        head.textContent = `${b.id} · ${ADDR(b.addr)} · ${b.count}×int = ${b.count * b.elemSize}B `;
        const badge = document.createElement('span');
        badge.className = 'bstatus'; badge.textContent = statusText;
        head.appendChild(badge);
        const elems = document.createElement('div');
        elems.className = 'blockelems';
        b.values.forEach((v, i) => {
          const cell = document.createElement('div');
          cell.className = 'cell elem';
          const idx = document.createElement('div');
          idx.className = 'cname'; idx.textContent = '[' + i + ']';
          const val = document.createElement('div');
          val.className = 'cval'; val.textContent = v === null ? '???' : v;
          const addr = document.createElement('div');
          addr.className = 'caddr'; addr.textContent = ADDR(b.addr + i * b.elemSize);
          cell.append(idx, val, addr);
          elems.appendChild(cell);
        });
        if (b.count > b.values.length) {
          const more = document.createElement('div');
          more.className = 'elemore'; more.textContent = '… 共 ' + b.count + ' 个';
          elems.appendChild(more);
        }
        wrap.append(head, elems);
        heapEl.appendChild(wrap);
      });
      if (!m.heap.length) heapEl.innerHTML = '<span style="font-size:13px;color:#94a3b8">（堆上还没有分配任何块）</span>';

      const live = m.heap.filter(b => b.status === 'live').length;
      const freed = m.heap.filter(b => b.status === 'freed').length;
      const leaked = m.heap.filter(b => b.status === 'leaked').length;
      $('mmStats').textContent = `堆块统计：使用中 ${live} · 已释放 ${freed} · 泄漏 ${leaked}`;

      requestAnimationFrame(drawArrows);
    }

    $('mmPrev').addEventListener('click', () => { if (step > 0) { step--; render(); } });
    $('mmNext').addEventListener('click', () => { if (step < SCENARIOS[si].steps.length) { step++; render(); } });
    $('mmReset').addEventListener('click', () => { step = 0; render(); });
    new ResizeObserver(drawArrows).observe($('mmZones'));
    render();
  }

  return { id: 'memory', name: '动态内存管理', mount };
}

// 新工具在这里注册：{ id, name, mount(host) }，导航会自动出现对应入口
const TOOLS = [makeBitwiseTool(), makePointerTool(), makeComplementTool(), makePrecedenceTool(), makeRecursionTool(), makeSortTool(), makeStructTool(), makeMemoryTool()];

const nav = document.getElementById('toolNav');
const hostEl = document.getElementById('toolHost');
TOOLS.forEach(tool => {
  const btn = document.createElement('button');
  btn.type = 'button'; btn.textContent = tool.name; btn.dataset.tool = tool.id;
  btn.addEventListener('click', () => {
    nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    hostEl.innerHTML = '';
    tool.mount(hostEl);
  });
  nav.appendChild(btn);
});
const more = document.createElement('button');
more.type = 'button'; more.disabled = true; more.textContent = '更多工具敬请期待';
nav.appendChild(more);
nav.querySelector('button').click();
</script>
</body>
